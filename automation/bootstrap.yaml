# Parent Application for clusters without an RHDP order; `make bootstrap` fills in the cluster's
# ingress domain, the repository (REPO_URL, default: gitops.repoUrl in values.yaml, so a fork deploys
# itself) and the git revision (REVISION, default: gitops.revision). On RHDP the Field Content CI
# creates the equivalent itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nemo-guardrails-eval-lab
  namespace: openshift-gitops
  labels:
    demo.redhat.com/application: field-content
    app.kubernetes.io/part-of: nemo-guardrails-eval-lab
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: GIT_REPO_URL
    targetRevision: GIT_REVISION
    path: automation/argocd
    helm:
      valuesObject:
        # The children and the Showroom guide follow the same repository and revision as this parent.
        gitops:
          repoUrl: GIT_REPO_URL
          revision: GIT_REVISION
        deployer:
          domain: DEPLOYER_DOMAIN
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
