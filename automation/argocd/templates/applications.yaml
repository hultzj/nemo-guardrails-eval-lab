{{- if .Values.showroom.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-showroom
  namespace: {{ .Values.argocd.namespace }}
  labels:
    demo.redhat.com/application: field-content
    app.kubernetes.io/part-of: {{ .Release.Name }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.showroom.chart.repoUrl }}
    targetRevision: {{ .Values.showroom.chart.revision }}
    path: {{ .Values.showroom.chart.path }}
    helm:
      valuesObject:
        showroom:
          namespace: {{ .Values.showroom.namespace }}
          content:
            repoUrl: {{ .Values.gitops.repoUrl | quote }}
            repoRef: {{ .Values.gitops.revision | quote }}
          terminal:
            enabled: {{ .Values.showroom.terminal }}
            image: {{ .Values.showroom.terminalImage | quote }}
        deployer:
          domain: {{ .Values.deployer.domain | quote }}
        demo:
          namespace: {{ .Values.lab.namespace | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.showroom.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Without this, a sync re-applies fields listed in ignoreDifferences.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
{{- end }}
{{- if .Values.prereqs.enabled }}
{{- $components := list (dict "name" "safety-model" "wave" "0") (dict "name" "tenants" "wave" "1") }}
{{- range $components }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  namespace: {{ $.Values.argocd.namespace }}
  labels:
    demo.redhat.com/application: field-content
    app.kubernetes.io/part-of: {{ $.Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $.Values.argocd.project }}
  source:
    repoURL: {{ $.Values.gitops.repoUrl }}
    targetRevision: {{ $.Values.gitops.revision }}
    path: {{ $.Values.gitops.basePath }}/components/{{ .name }}
    helm:
      valuesObject:
        lab: {{- toYaml $.Values.lab | nindent 10 }}
        safetyModel: {{- toYaml $.Values.safetyModel | nindent 10 }}
        images: {{- toYaml $.Values.images | nindent 10 }}
        workbench: {{- toYaml $.Values.workbench | nindent 10 }}
        gitops:
          repoUrl: {{ $.Values.gitops.repoUrl | quote }}
          revision: {{ $.Values.gitops.revision | quote }}
        argocdNamespace: {{ $.Values.argocd.namespace | quote }}
        partOf: {{ $.Release.Name | quote }}
        deployer:
          domain: {{ $.Values.deployer.domain | quote }}
  {{- if eq .name "tenants" }}
  # The OpenShift AI webhook and notebook controller add a sidecar, volumes, annotations, labels and
  # finalizers to each workbench Notebook, and the dashboard patches it to stop/start it: let them.
  # To change the workbench image, delete the Notebook and Argo CD recreates it.
  ignoreDifferences:
    - group: kubeflow.org
      kind: Notebook
      jsonPointers: [/spec/template/spec, /metadata/annotations, /metadata/labels, /metadata/finalizers]
    # Module 5: each participant writes their own judge API key into this Secret; keep it.
    - kind: Secret
      name: judge-api-key
      jsonPointers: [/data]
  {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $.Values.lab.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Without this, a sync re-applies fields listed in ignoreDifferences.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
{{- end }}
{{- end }}
