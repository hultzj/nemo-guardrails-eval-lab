{{- $users := required "lab.users is required" .Values.lab.users }}
{{- range $user := $users }}
{{- $ns := printf "%s%s" $user $.Values.lab.tenantSuffix }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    demo.redhat.com/application: field-content
    argocd.argoproj.io/managed-by: {{ $.Values.argocdNamespace }}
    app.kubernetes.io/part-of: {{ $.Values.partOf }}
    # A Data Science Project: the OpenShift AI dashboard lists it and its workbench.
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: {{ printf "%s: guardrails lab" $user | quote }}
---
# The NeMo server listens unauthenticated on :8000 behind its kube-rbac-proxy: without this policy
# another tenant's pod could call it by pod IP and skip the proxy (verified: 200 before, refused after).
# Admit only this namespace and openshift-ingress, where the OpenShift router (Routes) and the
# OpenShift AI data-science-gateway (the workbench URL) run.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-isolation
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels: {network.openshift.io/policy-group: ingress}
---
# Participants, and their workbench (the terminal and notebooks run as its ServiceAccount), read
# everything except Secrets (ClusterRole view) ...
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: participant-view
  namespace: {{ $ns }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: User, name: {{ $user | quote }}}
  - {kind: ServiceAccount, name: guardrails-lab, namespace: {{ $ns }}}
---
# ... and write only what the exercises change. Not ClusterRole edit: no Secrets, no Deployments.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guardrails-participant
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [trustyai.opendatahub.io]
    resources: [nemoguardrails]
    verbs: [get, list, watch, create, update, patch, delete]
  # Start and stop the workbench from the OpenShift AI dashboard (it patches the Notebook).
  - apiGroups: [kubeflow.org]
    resources: [notebooks]
    verbs: [get, list, watch, patch]
  # Module 5: the participant's own judge API key goes into the one Secret the lab created for it.
  # No create: a participant who could create Secrets could create a service-account-token one and
  # be handed a token for a ServiceAccount in the project. A Secret's type cannot change later.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [judge-api-key]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guardrails-participant
  namespace: {{ $ns }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: guardrails-participant}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: User, name: {{ $user | quote }}}
  - {kind: ServiceAccount, name: guardrails-lab, namespace: {{ $ns }}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rails-monitor
  namespace: {{ $ns }}
  annotations:
    # Lets the oauth-proxy sidecar use this ServiceAccount as an OAuth client for its Route.
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"rails-monitor"}}'
---
# The monitor follows the guardrails pod log and calls the guardrails Service. Its kube-rbac-proxy
# asks "may get services in this namespace": the operator writes resourceName, which the proxy
# ignores, so a rule restricted to resourceNames: [nemoguardrails-service] is denied (verified, 403).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rails-monitor
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [services]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rails-monitor
  namespace: {{ $ns }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: rails-monitor}
subjects:
  - {kind: ServiceAccount, name: rails-monitor, namespace: {{ $ns }}}
---
# oauth-proxy checks bearer tokens (the notebooks, curl) with TokenReview and SubjectAccessReview.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $ns }}-rails-monitor-auth-delegator
  labels:
    app.kubernetes.io/part-of: {{ $.Values.partOf }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator}
subjects:
  - {kind: ServiceAccount, name: rails-monitor, namespace: {{ $ns }}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rails-monitor-app
  namespace: {{ $ns }}
data:
  monitor.py: |
{{ $.Files.Get "files/monitor.py" | indent 4 }}
  index.html: |
{{ $.Files.Get "files/index.html" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rails-monitor
  namespace: {{ $ns }}
  labels: {app: rails-monitor}
spec:
  replicas: 1
  selector:
    matchLabels: {app: rails-monitor}
  template:
    metadata:
      labels: {app: rails-monitor}
      annotations:
        # Roll the pod when the app code changes.
        checksum/app: {{ printf "%s%s" ($.Files.Get "files/monitor.py") ($.Files.Get "files/index.html") | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: rails-monitor
      volumes:
        - name: app
          configMap: {name: rails-monitor-app}
        - name: cookie
          emptyDir: {medium: Memory}
        - name: tls
          secret: {secretName: rails-monitor-tls}
      initContainers:
        # A fresh session-cookie key per pod, so no secret lives in git.
        - name: cookie-secret
          image: {{ $.Values.images.python }}
          command: ["python3", "-c", "import secrets; open('/cookie/secret', 'w').write(secrets.token_hex(16))"]
          volumeMounts: [{name: cookie, mountPath: /cookie}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      containers:
        - name: monitor
          image: {{ $.Values.images.python }}
          command: ["python3", "-u", "/app/monitor.py"]
          volumeMounts: [{name: app, mountPath: /app}]
          # The app listens on 127.0.0.1 only, so the kubelet cannot probe it over HTTP.
          readinessProbe:
            exec:
              command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
            periodSeconds: 10
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
        - name: oauth-proxy
          image: {{ $.Values.images.oauthProxy }}
          args:
            - --https-address=:8443
            - --provider=openshift
            - --openshift-service-account=rails-monitor
            - --upstream=http://127.0.0.1:8080
            - --upstream-flush=100ms
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/cookie/secret
            - --skip-provider-button
            - '--openshift-sar={"namespace":"{{ $ns }}","resource":"services","resourceName":"rails-monitor","verb":"get"}'
            - '--openshift-delegate-urls={"/":{"namespace":"{{ $ns }}","resource":"services","name":"rails-monitor","verb":"get"}}'
          ports:
            - {name: https, containerPort: 8443}
          readinessProbe:
            httpGet: {path: /oauth/healthz, port: https, scheme: HTTPS}
            periodSeconds: 10
          volumeMounts:
            - {name: cookie, mountPath: /cookie}
            - {name: tls, mountPath: /etc/tls/private}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: rails-monitor
  namespace: {{ $ns }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: rails-monitor-tls
spec:
  selector: {app: rails-monitor}
  ports:
    - {name: https, port: 8443, targetPort: https}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rails-monitor
  namespace: {{ $ns }}
  annotations:
    # SSE: keep the event stream open past the router's default 30s idle timeout.
    haproxy.router.openshift.io/timeout: 1h
spec:
  to: {kind: Service, name: rails-monitor}
  port: {targetPort: https}
  tls: {termination: reencrypt, insecureEdgeTerminationPolicy: Redirect}
---
# Where the workbench gets the lab files: the repo and revision this deployment comes from. A
# ConfigMap Argo CD keeps current (the Notebook pod spec is ignored after creation), read by the
# pre-flight in the guide; a branch, tag or commit all work.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-source
  namespace: {{ $ns }}
data:
  repoUrl: {{ required "gitops.repoUrl is required" $.Values.gitops.repoUrl | quote }}
  revision: {{ required "gitops.revision is required" $.Values.gitops.revision | quote }}
---
# Module 5: where the participant puts their own judge API key (Argo CD ignores its data, so the
# key they write stays). Empty until then; only this project's participant and server can read it.
apiVersion: v1
kind: Secret
metadata:
  name: judge-api-key
  namespace: {{ $ns }}
type: Opaque
data:
  api-key: ""
---
# The participant's workbench: JupyterLab (terminal + notebooks) in this Data Science Project. Its
# ServiceAccount carries the participant's permissions (bindings above), so `oc` in its terminal and
# the notebooks act within this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guardrails-lab
  namespace: {{ $ns }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guardrails-lab-storage
  namespace: {{ $ns }}
  labels: {opendatahub.io/dashboard: "true"}
  annotations: {openshift.io/display-name: guardrails-lab-storage}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: {{ $.Values.workbench.storage }}}
---
# Shaped like the Notebook the OpenShift AI 3.5 dashboard creates (verified); its webhook injects the
# kube-rbac-proxy sidecar (access: get notebooks/guardrails-lab here) and the gateway route, which is
# why the tenants Application ignores the pod template (see applications.yaml).
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: guardrails-lab
  namespace: {{ $ns }}
  labels:
    app: guardrails-lab
    opendatahub.io/dashboard: "true"
    opendatahub.io/odh-managed: "true"
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    notebooks.opendatahub.io/inject-auth: "true"
    # Without a hardware profile the dashboard flags the workbench "Deprecated" (verified);
    # resources below stay inside default-profile's range (1-4 CPU, 2-8 GiB).
    opendatahub.io/hardware-profile-name: default-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    notebooks.opendatahub.io/last-image-selection: {{ $.Values.workbench.imageSelection | quote }}
    notebooks.opendatahub.io/last-image-version-git-commit-selection: {{ $.Values.workbench.imageCommit | quote }}
    opendatahub.io/image-display-name: {{ $.Values.workbench.imageDisplayName | quote }}
    openshift.io/display-name: guardrails-lab
    openshift.io/description: NeMo Guardrails evaluation lab
spec:
  template:
    spec:
      serviceAccountName: guardrails-lab
      enableServiceLinks: false
      containers:
        - name: guardrails-lab
          image: {{ $.Values.images.workbench }}
          imagePullPolicy: IfNotPresent
          workingDir: /opt/app-root/src
          env:
            - name: NOTEBOOK_ARGS
              value: |-
                --ServerApp.port=8888
                --ServerApp.token=''
                --ServerApp.password=''
                --ServerApp.base_url=/notebook/{{ $ns }}/guardrails-lab
                --ServerApp.quit_button=False
            - {name: JUPYTER_IMAGE, value: {{ $.Values.images.workbench | quote }}}
          ports:
            - {name: notebook-port, containerPort: 8888, protocol: TCP}
          livenessProbe:
            httpGet: {path: /notebook/{{ $ns }}/guardrails-lab/api, port: notebook-port, scheme: HTTP}
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /notebook/{{ $ns }}/guardrails-lab/api, port: notebook-port, scheme: HTTP}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - {name: guardrails-lab-storage, mountPath: /opt/app-root/src/}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: guardrails-lab-storage
          persistentVolumeClaim: {claimName: guardrails-lab-storage}
        - name: shm
          emptyDir: {medium: Memory}
{{- end }}
{{- with .Values.lab.decoyTenant }}
{{- $ns := printf "%s%s" . $.Values.lab.tenantSuffix }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    demo.redhat.com/application: field-content
    argocd.argoproj.io/managed-by: {{ $.Values.argocdNamespace }}
    app.kubernetes.io/part-of: {{ $.Values.partOf }}
---
# The NeMo server listens unauthenticated on :8000 behind its kube-rbac-proxy: without this policy
# another tenant's pod could call it by pod IP and skip the proxy (verified: 200 before, refused after).
# Admit only this namespace and openshift-ingress, where the OpenShift router (Routes) and the
# OpenShift AI data-science-gateway (the workbench URL) run.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-isolation
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels: {network.openshift.io/policy-group: ingress}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: regex-only
  namespace: {{ $ns }}
data:
  config.yaml: |
    rails:
      config:
        regex_detection:
          input:
            patterns: ['\d{3}-\d{2}-\d{4}']
      input:
        flows:
          - regex check input
  rails.co: |
    # Built-in flows only.
---
# A guarded endpoint nobody but the facilitator may call: Module 1's cross-tenant denial target.
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: nemoguardrails
  namespace: {{ $ns }}
  annotations:
    security.opendatahub.io/enable-auth: "true"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  nemoConfigs:
    - {name: regex-only, configMaps: [regex-only], default: true}
{{- end }}
