{{- $users := required "lab.users is required" .Values.lab.users }}
{{- range $user := $users }}
{{- $ns := printf "%s%s" $user $.Values.lab.tenantSuffix }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    demo.redhat.com/application: field-content
    argocd.argoproj.io/managed-by: {{ $.Values.argocdNamespace }}
    app.kubernetes.io/part-of: {{ $.Values.partOf }}
---
# Participants read everything except Secrets (ClusterRole view) ...
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: participant-view
  namespace: {{ $ns }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: User, name: {{ $user | quote }}}
---
# ... and write only what the exercises change. Not ClusterRole edit: no Secrets, no Deployments.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guardrails-participant
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [trustyai.opendatahub.io]
    resources: [nemoguardrails]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  # Web Terminal: the console creates the participant's terminal workspace in this project, and its
  # exec sidecar sets up the terminal by exec'ing into it as the participant ("Failed to create
  # kubeconfig in pod" without pods/exec, verified). Exec reaches only this namespace's pods, whose
  # ServiceAccounts can do less than the participant; the DevWorkspace webhook still limits exec
  # into a terminal pod to its creator.
  - apiGroups: [workspace.devfile.io]
    resources: [devworkspaces, devworkspacetemplates]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guardrails-participant
  namespace: {{ $ns }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: guardrails-participant}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: User, name: {{ $user | quote }}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rails-monitor
  namespace: {{ $ns }}
  annotations:
    # Lets the oauth-proxy sidecar use this ServiceAccount as an OAuth client for its Route.
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"rails-monitor"}}'
---
# The monitor follows the guardrails pod log and calls the guardrails Service. Its kube-rbac-proxy
# asks "may get services in this namespace": the operator writes resourceName, which the proxy
# ignores, so a rule restricted to resourceNames: [nemoguardrails-service] is denied (verified, 403).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rails-monitor
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [services]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rails-monitor
  namespace: {{ $ns }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: rails-monitor}
subjects:
  - {kind: ServiceAccount, name: rails-monitor, namespace: {{ $ns }}}
---
# oauth-proxy checks bearer tokens (the eval Job, curl) with TokenReview and SubjectAccessReview.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $ns }}-rails-monitor-auth-delegator
  labels:
    app.kubernetes.io/part-of: {{ $.Values.partOf }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator}
subjects:
  - {kind: ServiceAccount, name: rails-monitor, namespace: {{ $ns }}}
---
# The eval Job runs as this ServiceAccount; it may call the monitor and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eval-runner
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eval-runner
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [services]
    resourceNames: [rails-monitor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eval-runner
  namespace: {{ $ns }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: eval-runner}
subjects:
  - {kind: ServiceAccount, name: eval-runner, namespace: {{ $ns }}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rails-monitor-app
  namespace: {{ $ns }}
data:
  monitor.py: |
{{ $.Files.Get "files/monitor.py" | indent 4 }}
  index.html: |
{{ $.Files.Get "files/index.html" | indent 4 }}
  eval.py: |
{{ $.Files.Get "files/eval.py" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eval-dataset
  namespace: {{ $ns }}
data:
  dataset.jsonl: |
{{ $.Files.Get "files/dataset.jsonl" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rails-monitor
  namespace: {{ $ns }}
  labels: {app: rails-monitor}
spec:
  replicas: 1
  selector:
    matchLabels: {app: rails-monitor}
  template:
    metadata:
      labels: {app: rails-monitor}
      annotations:
        # Roll the pod when the app code changes.
        checksum/app: {{ printf "%s%s%s" ($.Files.Get "files/monitor.py") ($.Files.Get "files/index.html") ($.Files.Get "files/eval.py") | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: rails-monitor
      volumes:
        - name: app
          configMap: {name: rails-monitor-app}
        - name: cookie
          emptyDir: {medium: Memory}
        - name: tls
          secret: {secretName: rails-monitor-tls}
      initContainers:
        # A fresh session-cookie key per pod, so no secret lives in git.
        - name: cookie-secret
          image: {{ $.Values.images.python }}
          command: ["python3", "-c", "import secrets; open('/cookie/secret', 'w').write(secrets.token_hex(16))"]
          volumeMounts: [{name: cookie, mountPath: /cookie}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      containers:
        - name: monitor
          image: {{ $.Values.images.python }}
          command: ["python3", "-u", "/app/monitor.py"]
          volumeMounts: [{name: app, mountPath: /app}]
          # The app listens on 127.0.0.1 only, so the kubelet cannot probe it over HTTP.
          readinessProbe:
            exec:
              command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
            periodSeconds: 10
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
        - name: oauth-proxy
          image: {{ $.Values.images.oauthProxy }}
          args:
            - --https-address=:8443
            - --provider=openshift
            - --openshift-service-account=rails-monitor
            - --upstream=http://127.0.0.1:8080
            - --upstream-flush=100ms
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/cookie/secret
            - --skip-provider-button
            - '--openshift-sar={"namespace":"{{ $ns }}","resource":"services","resourceName":"rails-monitor","verb":"get"}'
            - '--openshift-delegate-urls={"/":{"namespace":"{{ $ns }}","resource":"services","name":"rails-monitor","verb":"get"}}'
          ports:
            - {name: https, containerPort: 8443}
          readinessProbe:
            httpGet: {path: /oauth/healthz, port: https, scheme: HTTPS}
            periodSeconds: 10
          volumeMounts:
            - {name: cookie, mountPath: /cookie}
            - {name: tls, mountPath: /etc/tls/private}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: rails-monitor
  namespace: {{ $ns }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: rails-monitor-tls
spec:
  selector: {app: rails-monitor}
  ports:
    - {name: https, port: 8443, targetPort: https}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rails-monitor
  namespace: {{ $ns }}
  annotations:
    # SSE: keep the event stream open past the router's default 30s idle timeout.
    haproxy.router.openshift.io/timeout: 1h
spec:
  to: {kind: Service, name: rails-monitor}
  port: {targetPort: https}
  tls: {termination: reencrypt, insecureEdgeTerminationPolicy: Redirect}
{{- end }}
{{- with .Values.lab.decoyTenant }}
{{- $ns := printf "%s%s" . $.Values.lab.tenantSuffix }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    demo.redhat.com/application: field-content
    argocd.argoproj.io/managed-by: {{ $.Values.argocdNamespace }}
    app.kubernetes.io/part-of: {{ $.Values.partOf }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: regex-only
  namespace: {{ $ns }}
data:
  config.yaml: |
    rails:
      config:
        regex_detection:
          input:
            patterns: ['\d{3}-\d{2}-\d{4}']
      input:
        flows:
          - regex check input
  rails.co: |
    # Built-in flows only.
---
# A guarded endpoint nobody but the facilitator may call: Module 1's cross-tenant denial target.
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: nemoguardrails
  namespace: {{ $ns }}
  annotations:
    security.opendatahub.io/enable-auth: "true"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  nemoConfigs:
    - {name: regex-only, configMaps: [regex-only], default: true}
{{- end }}
