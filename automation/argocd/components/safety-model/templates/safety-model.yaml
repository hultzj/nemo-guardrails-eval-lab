apiVersion: v1
kind: Namespace
metadata:
  name: {{ required "lab.namespace is required" .Values.lab.namespace }}
  labels:
    demo.redhat.com/application: field-content
    # The OpenShift GitOps operator grants this Argo CD instance admin here; no cluster-wide grant needed.
    argocd.argoproj.io/managed-by: {{ .Values.argocdNamespace }}
    # Ownership: make bootstrap refuses an existing namespace without this lab's label.
    app.kubernetes.io/part-of: {{ .Values.partOf }}
---
# Nemotron Safety Guard 8B (Q4_K_M) on CPU. llama.cpp answers an OpenAI-compatible
# /v1/chat/completions, which NeMo Guardrails' content_safety rail calls.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safety-guard
  namespace: {{ .Values.lab.namespace }}
  labels: {app: safety-guard}
spec:
  replicas: {{ .Values.safetyModel.replicas }}
  selector:
    matchLabels: {app: safety-guard}
  template:
    metadata:
      labels: {app: safety-guard}
    spec:
      volumes:
        - name: models
          emptyDir: {sizeLimit: 8Gi}
      initContainers:
        # The model file comes from the internet: pin the revision and refuse anything whose hash differs.
        - name: fetch-model
          image: {{ .Values.images.python }}
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              curl -fsSL --retry 5 -o /models/model.gguf "$MODEL_URL"
              echo "$MODEL_SHA256  /models/model.gguf" | sha256sum -c -
          env:
            - {name: MODEL_URL, value: {{ .Values.safetyModel.url | quote }}}
            - {name: MODEL_SHA256, value: {{ .Values.safetyModel.sha256 | quote }}}
          volumeMounts: [{name: models, mountPath: /models}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            # Writing the 4.9 GB file through the page cache counts against this limit; 512Mi got OOM-killed.
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 2Gi}
      containers:
        - name: llama-server
          image: {{ .Values.images.llamacpp }}
          # This llama.cpp build rejects --flag=value: flag and value are separate arguments.
          args:
            - --model
            - /models/model.gguf
            - --alias
            - safety-guard
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ctx-size
            - {{ mul 2048 .Values.safetyModel.parallel | quote }}
            - --parallel
            - {{ .Values.safetyModel.parallel | quote }}
            - --threads
            - {{ .Values.safetyModel.threads | quote }}
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts: [{name: models, mountPath: /models}]
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 120
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: {{ .Values.safetyModel.threads | quote }}, memory: 8Gi}
            limits: {cpu: {{ .Values.safetyModel.threads | quote }}, memory: 12Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: safety-guard
  namespace: {{ .Values.lab.namespace }}
spec:
  selector: {app: safety-guard}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# llama.cpp has no authentication: only this lab's namespaces may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: safety-guard-lab-only
  namespace: {{ .Values.lab.namespace }}
spec:
  podSelector:
    matchLabels: {app: safety-guard}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: {{ .Values.partOf }}
      ports:
        - {port: 8080, protocol: TCP}
